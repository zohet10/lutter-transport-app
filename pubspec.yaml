name: transporte

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  file_picker: ^12.2.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  archive: ^4.2.0
  xml: ^7.0.1
  file_selector: ^1.1.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_auth: ^6.6.1
  share_plus: ^13.3.0
  path_provider: ^2.1.2
  excel_plus: ^1.0.0
  universal_html: ^2.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/zafi_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/zafi_logo.png